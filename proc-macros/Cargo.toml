[package]
name = "whippyunits-proc-macros"
version = "0.3.0"
edition = "2021"
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Procedural macros for whippyunits unit definitions and declarators"
keywords = ["units", "measurement", "dimensional", "type-safety", "proc-macro"]
categories = ["science", "no-std", "development-tools"]

[lib]
proc-macro = true


[dependencies]
proc-macro-crate = "3"
proc-macro2 = "1.0"
quote = "1.0"
strsim = "0.11"
syn = { version = "2.0", features = ["full", "visit-mut"] }
whippyunits-core = { path = "../whippyunits-core", version = "0.3.0", default-features = false }

[features]
nightly-gca = ["whippyunits-core/nightly-gca"]
# Extend arithmetic inputs from +/-32 to +/-200 without changing quantity types.
wide-exponents = ["whippyunits-core/wide-exponents"]
default = ["all-units", "literals", "wide-exponents"]
all-units = ["units-dynamics", "units-electrical", "units-thermal", "units-chemical", "units-photometric"]
units-dynamics = []
units-si-dynamics = []
units-dynamics-conversions = ["units-si-dynamics"]
units-electrical = ["units-dynamics"]
units-thermal = ["units-dynamics"]
units-chemical = ["units-dynamics"]
units-photometric = ["units-dynamics"]
literals = []
