[package]
name = "whippyunits-formatter-wasm"
version.workspace = true
edition = "2021"
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly build of the whippyunits type formatter, used by the VS Code extension"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
# The proxy's formatting library without its binary-only dependencies (tokio etc.)
whippyunits-lsp-proxy = { path = "../../../lsp-proxy", default-features = false }
# For computing a type straight from a `qty!(…)` invocation's arguments
# Formatting needs alloc and the core unit metadata, not generated catalogs.
whippyunits = { path = "../../..", default-features = false, features = ["alloc"] }
whippyunits-core = { path = "../../../whippyunits-core", default-features = false }
syn = { version = "2.0", features = ["full", "parsing", "printing"] }
quote = "1.0"
