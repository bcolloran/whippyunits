[package]
name = "whippyunits-lsp-proxy"
version = "0.3.0"
edition = "2021"
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "LSP proxy for enhanced whippyunits type display in IDEs"
keywords = ["whippyunits", "lsp", "language-server", "ide", "rust-analyzer"]
categories = ["development-tools"]
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"], optional = true }
anyhow = "1.0"
log = "0.4"
env_logger = { version = "0.10", optional = true }
tempfile = { version = "3.0", optional = true }
shellexpand = { version = "3.0", optional = true }
clap = { version = "4.0", features = ["derive"], optional = true }
# Formatting needs alloc and the core unit metadata, not generated catalogs.
whippyunits = { path = "..", version = "0.3.0", default-features = false, features = ["alloc"] }
whippyunits-core = { path = "../whippyunits-core", version = "0.3.0" }
syn = { version = "2.0", features = ["full", "parsing", "printing"] }
quote = "1.0"

[features]
default = ["bin"]
# Dependencies only the `lsp-proxy` binary needs. Disable this feature to build
# just the formatting library, e.g. for wasm32 (see editors/vscode/formatter-wasm).
bin = ["dep:tokio", "dep:env_logger", "dep:tempfile", "dep:shellexpand", "dep:clap"]

[[bin]]
name = "lsp-proxy"
path = "src/main.rs"
required-features = ["bin"]



